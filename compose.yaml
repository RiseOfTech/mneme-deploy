# Local single-user Mneme stack: postgres + mneme-auth + mneme-core + mneme-web.
# Images are built from the sibling repositories (../mneme-core, ../mneme-auth,
# ../mneme-web). All ports bind to 127.0.0.1 only — nothing is reachable from the network.
#
# Use ./mneme-start and ./mneme-stop rather than calling compose directly: the start
# script creates keys/ and .env on first run.

name: mneme

x-java-service: &java-service
  restart: "no"
  environment: &java-env
    SPRING_PROFILES_ACTIVE: prod
    JAVA_TOOL_OPTIONS: -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./mneme-start to create .env}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?run ./mneme-start to create .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?run ./mneme-start to create .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging: *logging

  mneme-auth:
    <<: *java-service
    build: ../mneme-auth
    image: mneme-auth:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *java-env
      MNEME_AUTH_DB_URL: jdbc:postgresql://postgres:5432/mneme_auth
      MNEME_AUTH_DB_USERNAME: mneme_auth
      MNEME_AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      MNEME_AUTH_PRIVATE_KEY_PATH: file:/keys/private.pem
      MNEME_AUTH_CORS_ALLOWEDORIGINS_0: http://localhost:${WEB_PORT:-8000}
    volumes:
      - ./keys/private.pem:/keys/private.pem:ro
    ports:
      - 127.0.0.1:8081:8081

  mneme-core:
    <<: *java-service
    build: ../mneme-core
    image: mneme-core:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/mneme
      DB_USERNAME: mneme
      DB_PASSWORD: ${CORE_DB_PASSWORD}
      JWT_PUBLIC_KEY: file:/keys/public.pem
      APP_CORS_ALLOWEDORIGINS_0: http://localhost:${WEB_PORT:-8000}
    volumes:
      - ./keys/public.pem:/keys/public.pem:ro
    ports:
      - 127.0.0.1:8080:8080

  mneme-web:
    build:
      context: ../mneme-web
      args:
        # Vite inlines these at build time; the browser calls the backends directly.
        VITE_API_BASE_URL: http://localhost:8080
        VITE_AUTH_BASE_URL: http://localhost:8081
    image: mneme-web:local
    ports:
      - 127.0.0.1:${WEB_PORT:-8000}:80
    logging: *logging

volumes:
  # All cards and accounts live here. `docker compose down -v` deletes it.
  pgdata:
